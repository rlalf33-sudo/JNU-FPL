<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>식품 품질관리 시뮬레이터</title><style>*{box-sizing:border-box}body{font-family:Paperlogy,'Malgun Gothic',sans-serif;background:#f3f6fa;color:#17304d;margin:0;padding:24px}main{max-width:1150px;margin:auto;background:white;padding:30px;border:1px solid #dce4ec;border-radius:12px}h1{margin:0;font-size:30px}p{color:#526579}svg{width:100%;height:auto;max-height:420px}.controls,.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;margin:20px 0}label{display:block;font-weight:bold}input[type=range]{width:100%;accent-color:#159b8a}input[type=number]{width:100%;padding:8px;border:1px solid #b9c8d6;border-radius:4px;font-size:18px}output{float:right}article{border-top:2px solid #dce4ec;padding:14px 0}strong{display:block;font-size:32px;margin-top:8px;color:#087e70}button{padding:10px 20px;border:1px solid #aab9c7;background:white;border-radius:5px;font-size:16px;cursor:pointer}small{color:#526579}</style><main><h1>공정의 평균·표준편차와 규격 이탈률</h1><p>식품 품질관리 시뮬레이터 · 정규분포 가정</p><svg id="graph" viewBox="0 0 1000 330" role="img" aria-label="제품 중량 확률밀도 그래프"></svg><div class="controls"><label>평균 (g) <output id="mo"></output><input id="m" type="range" min="90" max="110" step="0.1" value="100"></label><label>표준편차 (g) <output id="so"></output><input id="s" type="range" min="1" max="6" step="0.1" value="2"></label><label>규격 하한 (g)<input id="lo" type="number" step="0.1" value="96"></label><label>규격 상한 (g)<input id="hi" type="number" step="0.1" value="104"></label><label>생산량 (개)<input id="n" type="number" min="1" max="1000000000" step="1" value="10000"></label></div><div id="error" role="alert"></div><div class="results"><article>규격 충족 확률<strong id="pass"></strong></article><article>규격 이탈 확률<strong id="fail"></strong></article><article>예상 규격 이탈 수<strong id="count"></strong></article></div><button id="reset">초기화</button> <button onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()">전체 화면</button><p><small>교육용 가상 규격입니다. 예상 이탈 수는 정규분포 모형의 기대값을 반올림한 결과이며 실제 생산 결과를 보장하지 않습니다.</small></p></main><script>const $=id=>document.getElementById(id);function cdf(z){let a=Math.abs(z)/Math.sqrt(2),t=1/(1+.3275911*a),e=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-a*a);return (1+Math.sign(z)*e)/2}function draw(){let m=+$('m').value,s=+$('s').value,l=+$('lo').value,h=+$('hi').value,n=+$('n').value;$('mo').textContent=m.toFixed(1);$('so').textContent=s.toFixed(1);if(!$('lo').value||!$('hi').value||!Number.isFinite(l)||!Number.isFinite(h)||l>=h||!Number.isInteger(n)||n<1||n>1e9){$('error').textContent='하한 < 상한, 생산량은 양의 정수로 입력하세요.';for(let k of ['pass','fail','count'])$(k).textContent='—';$('graph').innerHTML='';return}$('error').textContent='';let f=Math.max(0,Math.min(1,cdf((l-m)/s)+cdf((m-h)/s)));$('pass').textContent=((1-f)*100).toFixed(4)+'%';$('fail').textContent=(f*100).toFixed(4)+'%';$('count').textContent='약 '+Math.round(n*f).toLocaleString('ko-KR')+'개';let a=Math.min(75,l-2),b=Math.max(125,h+2),X=x=>65+900*(x-a)/(b-a),Y=x=>270-240/s*Math.exp(-.5*((x-m)/s)**2),path=(u,v)=>Array.from({length:501},(_,i)=>{let x=u+(v-u)*i/500;return `${i?'L':'M'}${X(x)} ${Y(x)}`}).join(' '),area=(u,v,c)=>`<path d="${path(u,v)} L${X(v)} 270 L${X(u)} 270 Z" fill="${c}"/>`;let g=area(a,l,'#e6a46b')+area(l,h,'#83cfc1')+area(h,b,'#e6a46b')+`<path d="${path(a,b)}" fill="none" stroke="#397ead" stroke-width="3"/><path d="M65 20 V270 H965" fill="none" stroke="#8797a7"/>`;for(let v of [l,h])g+=`<line x1="${X(v)}" x2="${X(v)}" y1="20" y2="270" stroke="#d17b35" stroke-dasharray="7 5"/><text x="${X(v)}" y="292" text-anchor="middle" fill="#a35c23" font-size="15">${v}</text>`;g+=`<text x="${X(m)}" y="313" text-anchor="middle" font-size="15">평균 ${m.toFixed(1)} g</text><text x="965" y="313" text-anchor="end" font-size="15">중량 (g)</text><text x="65" y="15" font-size="14">확률밀도</text>`;$('graph').innerHTML=g}for(let id of ['m','s','lo','hi','n'])$(id).addEventListener('input',draw);$('reset').onclick=()=>{for(let [k,v] of Object.entries({m:100,s:2,lo:96,hi:104,n:10000}))$(k).value=v;draw()};draw();</script></html>
